<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
const doAsyncStuffWithCallback = (n1, n2, callback) => {
  const resultado = n1 + n2
  return setTimeout(() => {
    callback(resultado)
  }, 500)
}

const doAsyncStuffWithPromises = (n1, n2) => {
  const resultado = n1 + n2
  return new Promise(resolve => {
    setTimeout(() => {
      resolve(resultado)
    }, 500)
  })
}

doAsyncStuffWithCallback(1, 3, (result) => {
  console.log(result)
})

doAsyncStuffWithPromises(1, 3)
  .then(result => console.log())
</script>
<body>
    
</body>
</html>
